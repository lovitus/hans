name: Build, Test & Release

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------
  # Native Linux runners: several kernel/distro versions, amd64 + arm64.
  # ---------------------------------------------------------------------
  build-linux-native:
    name: Linux ${{ matrix.label }} (native)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: amd64-ubuntu22.04
          - os: ubuntu-24.04
            label: amd64-ubuntu24.04
          - os: ubuntu-24.04-arm
            label: arm64-ubuntu24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential net-tools
      - name: Build
        run: make
      - name: Test (version, help, connection)
        run: |
          chmod +x scripts/test-hans.sh
          scripts/test-hans.sh ./hans "linux-${{ matrix.label }}"
      - uses: actions/upload-artifact@v4
        with:
          name: hans-linux-${{ matrix.label }}
          path: hans

  # ---------------------------------------------------------------------
  # Emulated Linux CPU architectures via QEMU (docker buildx binfmt).
  # ---------------------------------------------------------------------
  build-linux-emulated:
    name: Linux ${{ matrix.label }} (qemu)
    runs-on: ubuntu-24.04
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/386
            image: i386/debian:bookworm
            label: i386
            experimental: false
          - platform: linux/arm/v7
            image: ubuntu:24.04
            label: armv7
            experimental: false
          - platform: linux/arm64
            image: ubuntu:24.04
            label: arm64-qemu
            experimental: false
          - platform: linux/mips64le
            image: debian:bookworm
            label: mips64le
            experimental: true
          - platform: linux/ppc64le
            image: ubuntu:24.04
            label: ppc64le
            experimental: true
          - platform: linux/riscv64
            image: ubuntu:24.04
            label: riscv64
            experimental: true
          - platform: linux/s390x
            image: ubuntu:24.04
            label: s390x
            experimental: true
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - name: Build & test in ${{ matrix.platform }} container
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            -v "${{ github.workspace }}:/work" -w /work \
            ${{ matrix.image }} bash -c '
              set -e
              apt-get update -qq
              apt-get install -y -qq build-essential
              make
              chmod +x scripts/test-hans.sh
              scripts/test-hans.sh ./hans "linux-${{ matrix.label }}"
              cp hans "hans-linux-${{ matrix.label }}"
            '
      - uses: actions/upload-artifact@v4
        with:
          name: hans-linux-${{ matrix.label }}
          path: hans-linux-${{ matrix.label }}

  # ---------------------------------------------------------------------
  # Linux static musl builds (Alpine + `-static`).
  #
  # The glibc-linked binaries from build-linux-native/build-linux-emulated
  # require GLIBC_2.34 (glibc 2.34, released 2021), because that's what the
  # Ubuntu/Debian base images link against. They will refuse to run
  # ("version GLIBC_2.34 not found") on older distros/kernels such as
  # CentOS 7/8, RHEL 7/8, Debian 10, or Ubuntu 18.04/20.04, and on any
  # embedded/router Linux that doesn't ship glibc at all.
  #
  # These musl builds are fully statically linked (musl supports static
  # linking cleanly, unlike glibc's NSS-dependent dynamic linking), so they
  # have *no* libc version dependency at all and run on essentially any
  # Linux kernel new enough to support the syscalls hans uses - old
  # distros, musl-based distros (Alpine, postmarketOS, ...), and minimal/
  # embedded systems included.
  # ---------------------------------------------------------------------
  build-linux-musl:
    name: Linux ${{ matrix.label }} (musl static)
    runs-on: ubuntu-24.04
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            label: amd64-musl
            experimental: false
          - platform: linux/arm64
            label: arm64-musl
            experimental: false
          - platform: linux/386
            label: i386-musl
            experimental: false
          - platform: linux/arm/v7
            label: armv7-musl
            experimental: false
          - platform: linux/ppc64le
            label: ppc64le-musl
            experimental: true
          - platform: linux/riscv64
            label: riscv64-musl
            experimental: true
          - platform: linux/s390x
            label: s390x-musl
            experimental: true
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - name: Build & test in ${{ matrix.platform }} alpine (musl) container
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            -v "${{ github.workspace }}:/work" -w /work \
            alpine:3.20 sh -c '
              set -e
              apk add --no-cache build-base linux-headers procps
              make LDFLAGS=-static
              chmod +x scripts/test-hans.sh
              sh scripts/test-hans.sh ./hans "linux-${{ matrix.label }}"
              cp hans "hans-linux-${{ matrix.label }}"
            '
      - uses: actions/upload-artifact@v4
        with:
          name: hans-linux-${{ matrix.label }}
          path: hans-linux-${{ matrix.label }}

  # ---------------------------------------------------------------------
  # macOS: Intel (x86_64) and Apple Silicon (arm64).
  # ---------------------------------------------------------------------
  build-macos:
    name: macOS ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            label: amd64
          - os: macos-14
            label: arm64
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make
      - name: Test (version, help, connection)
        run: |
          chmod +x scripts/test-hans.sh
          scripts/test-hans.sh ./hans "macos-${{ matrix.label }}"
      - uses: actions/upload-artifact@v4
        with:
          name: hans-macos-${{ matrix.label }}
          path: hans

  # ---------------------------------------------------------------------
  # Windows via Cygwin (amd64 only).
  #
  # NOTE on arm64: Cygwin has never shipped an arm64/aarch64 port (it only
  # builds for x86_64 and, historically, x86). There is therefore no Cygwin
  # toolchain or cygwin1.dll runtime available for Windows-on-ARM, so a
  # windows-11-arm job is not possible without porting hans away from Cygwin
  # entirely (e.g. to MSYS2/MinGW-w64 and rewriting the POSIX-only calls
  # such as syslog()/daemon()/getaddrinfo() it relies on). Out of scope here.
  # ---------------------------------------------------------------------
  build-windows:
    name: Windows amd64 (cygwin)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Cygwin toolchain
        uses: egor-tensin/setup-cygwin@v4
        with:
          packages: gcc-g++ make
      - name: Build
        shell: C:\tools\cygwin\bin\bash.exe --login -eo pipefail -o igncr '{0}'
        run: |
          cd "$(cygpath -u '${{ github.workspace }}')"
          make CPPFLAGS='-c -g -std=gnu++98 -fpermissive -Wall -Wextra -Wno-sign-compare -Wno-missing-field-initializers -DWIN32'
          if [ -f hans.exe ] && [ ! -f hans ]; then cp hans.exe hans; fi
      - name: Test (version, help, connection)
        shell: C:\tools\cygwin\bin\bash.exe --login -eo pipefail -o igncr '{0}'
        run: |
          cd "$(cygpath -u '${{ github.workspace }}')"
          chmod +x scripts/test-hans.sh
          BIN=hans
          [ -f hans.exe ] && BIN=hans.exe
          ./scripts/test-hans.sh "./$BIN" "windows-amd64-cygwin"
      - name: Bundle Cygwin runtime DLLs
        shell: C:\tools\cygwin\bin\bash.exe --login -eo pipefail -o igncr '{0}'
        run: |
          # Collect every Cygwin DLL imported by hans.exe. A C++ build needs
          # cygwin1.dll plus the Cygwin libgcc and libstdc++ runtimes; bundling
          # only cygwin1.dll fails before main() with STATUS_DLL_NOT_FOUND.
          cd "$(cygpath -u '${{ github.workspace }}')"
          objdump -p hans.exe |
            awk '/DLL Name: cyg/ { print $3 }' |
            while IFS= read -r dll; do
              source="$(cygpath -u "C:\\tools\\cygwin\\bin\\$dll")"
              test -f "$source"
              cp "$source" .
            done
          ls -la cyg*.dll
      - name: Test packaged executable from PowerShell
        shell: pwsh
        run: |
          $output = (& .\hans.exe 2>&1 | Out-String)
          if ($output -notmatch 'IP over ICMP version') {
            throw "Packaged hans.exe did not start from PowerShell. Output: $output"
          }
          # No arguments intentionally prints usage and exits non-zero.
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: hans-windows-amd64-cygwin
          path: |
            hans.exe
            cyg*.dll

  # ---------------------------------------------------------------------
  # FreeBSD: amd64, aarch64, riscv64, powerpc64 across kernel releases.
  # ---------------------------------------------------------------------
  build-freebsd:
    name: FreeBSD ${{ matrix.release }} ${{ matrix.arch }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: "15.1"
            arch: amd64
            experimental: false
          - release: "15.1"
            arch: aarch64
            experimental: true
          - release: "15.1"
            arch: riscv64
            experimental: true
          - release: "15.1"
            arch: powerpc64
            experimental: true
          - release: "14.2"
            arch: amd64
            experimental: false
    steps:
      - uses: actions/checkout@v4
      - name: Build & test in FreeBSD ${{ matrix.release }} (${{ matrix.arch }})
        uses: vmactions/freebsd-vm@v1
        with:
          release: ${{ matrix.release }}
          arch: ${{ matrix.arch }}
          usesh: true
          sync: ${{ (matrix.arch == 'riscv64' || matrix.arch == 'powerpc64') && 'scp' || 'rsync' }}
          prepare: |
            true
          run: |
            cd $GITHUB_WORKSPACE
            make GCC=cc GPP=c++
            chmod +x scripts/test-hans.sh
            sh scripts/test-hans.sh ./hans "freebsd-${{ matrix.release }}-${{ matrix.arch }}"
            cp hans "hans-freebsd-${{ matrix.release }}-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: hans-freebsd-${{ matrix.release }}-${{ matrix.arch }}
          path: hans-freebsd-${{ matrix.release }}-${{ matrix.arch }}

  # ---------------------------------------------------------------------
  # OpenBSD: amd64, aarch64, riscv64 across kernel releases.
  # ---------------------------------------------------------------------
  build-openbsd:
    name: OpenBSD ${{ matrix.release }} ${{ matrix.arch }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: "7.9"
            arch: amd64
            experimental: false
          - release: "7.9"
            arch: aarch64
            experimental: true
          - release: "7.9"
            arch: riscv64
            experimental: true
          - release: "7.6"
            arch: amd64
            experimental: false
    steps:
      - uses: actions/checkout@v4
      - name: Build & test in OpenBSD ${{ matrix.release }} (${{ matrix.arch }})
        uses: vmactions/openbsd-vm@v1
        with:
          release: ${{ matrix.release }}
          arch: ${{ matrix.arch }}
          usesh: true
          prepare: |
            true
          run: |
            cd $GITHUB_WORKSPACE
            make GCC=cc GPP=c++
            chmod +x scripts/test-hans.sh
            sh scripts/test-hans.sh ./hans "openbsd-${{ matrix.release }}-${{ matrix.arch }}"
            cp hans "hans-openbsd-${{ matrix.release }}-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: hans-openbsd-${{ matrix.release }}-${{ matrix.arch }}
          path: hans-openbsd-${{ matrix.release }}-${{ matrix.arch }}

  # ---------------------------------------------------------------------
  # NetBSD: amd64, aarch64, riscv64 across kernel releases.
  # ---------------------------------------------------------------------
  build-netbsd:
    name: NetBSD ${{ matrix.release }} ${{ matrix.arch }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: "11.0"
            arch: amd64
            experimental: false
          - release: "11.0"
            arch: aarch64
            experimental: true
          # riscv64 excluded: the vmactions NetBSD riscv64 VM never reaches a
          # usable state on GitHub-hosted runners (boots but hangs before ssh
          # is reachable), so the job cannot finish.
          - release: "10.1"
            arch: amd64
            experimental: false
          - release: "9.4"
            arch: amd64
            experimental: true
    steps:
      - uses: actions/checkout@v4
      - name: Build & test in NetBSD ${{ matrix.release }} (${{ matrix.arch }})
        uses: vmactions/netbsd-vm@v1
        with:
          release: ${{ matrix.release }}
          arch: ${{ matrix.arch }}
          usesh: true
          prepare: |
            true
          run: |
            cd $GITHUB_WORKSPACE
            make GCC=cc GPP=c++
            chmod +x scripts/test-hans.sh
            sh scripts/test-hans.sh ./hans "netbsd-${{ matrix.release }}-${{ matrix.arch }}"
            cp hans "hans-netbsd-${{ matrix.release }}-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: hans-netbsd-${{ matrix.release }}-${{ matrix.arch }}
          path: hans-netbsd-${{ matrix.release }}-${{ matrix.arch }}

  # ---------------------------------------------------------------------
  # Automatically publish a GitHub Release with every built binary.
  # ---------------------------------------------------------------------
  release:
    name: Publish release
    if: always() && github.event_name != 'pull_request'
    needs:
      - build-linux-native
      - build-linux-emulated
      - build-linux-musl
      - build-macos
      - build-windows
      - build-freebsd
      - build-openbsd
      - build-netbsd
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten artifacts
        run: |
          mkdir -p release
          for d in artifacts/*/; do
            name="$(basename "$d")"
            if [ "$name" = "hans-windows-amd64-cygwin" ]; then
              # Keep the executable and its runtime dependency under the exact
              # filenames required by the Windows loader. Publishing them as
              # separately prefixed release assets breaks Cygwin startup
              # because the loader looks specifically for "cygwin1.dll".
              (
                cd "$d"
                zip -q "$GITHUB_WORKSPACE/release/$name.zip" hans.exe cyg*.dll
              )
              continue
            fi
            for f in "$d"*; do
              [ -f "$f" ] || continue
              fname="$(basename "$f")"
              if [ "$fname" = "$name" ]; then
                cp "$f" "release/$name"
              else
                cp "$f" "release/$name-$fname"
              fi
            done
          done
          ls -la release

      - name: Determine release tag
        id: tag
        env:
          GIT_REF: ${{ github.ref }}
        run: |
          if [[ "$GIT_REF" == refs/tags/* ]]; then
            {
              echo "tag=${GIT_REF#refs/tags/}"
              echo "prerelease=false"
              echo "name=hans ${GIT_REF#refs/tags/}"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "tag=latest"
              echo "prerelease=true"
              echo "name=Continuous build (${GITHUB_SHA::7})"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.name }}
          prerelease: ${{ steps.tag.outputs.prerelease }}
          make_latest: ${{ steps.tag.outputs.prerelease == 'false' }}
          generate_release_notes: true
          files: release/*
