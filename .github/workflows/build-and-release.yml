name: Build, Test & Release

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------
  # Native Linux runners: several kernel/distro versions, amd64 + arm64.
  # ---------------------------------------------------------------------
  build-linux-native:
    name: Linux ${{ matrix.label }} (native)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: amd64-ubuntu22.04
            runtime_image: ubuntu:22.04
          - os: ubuntu-24.04
            label: amd64-ubuntu24.04
            runtime_image: ubuntu:24.04
          - os: ubuntu-24.04-arm
            label: arm64-ubuntu24.04
            runtime_image: ubuntu:24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential net-tools curl iproute2 iptables python3 util-linux
      - name: Build
        run: |
          make test
          if [ "${{ matrix.label }}" = "amd64-ubuntu24.04" ]; then
            make clean
            make test hans GPP='g++ -fsanitize=address,undefined -fno-omit-frame-pointer' \
              GCC='gcc -fsanitize=address,undefined -fno-omit-frame-pointer'
            sanitizer_product="$(mktemp -d)"
            chmod 755 "$sanitizer_product"
            install -m 755 hans "$sanitizer_product/hans"
            install -m 644 scripts/test-socks5-udp.py \
              "$sanitizer_product/test-socks5-udp.py"
            sudo env ASAN_OPTIONS=detect_leaks=0 \
              scripts/test-userspace.sh "$sanitizer_product/hans"
            rm -rf "$sanitizer_product"
            make clean
          fi
          make LDFLAGS=-static
          if readelf -d hans 2>/dev/null | grep -q NEEDED; then
            echo "hans unexpectedly has dynamic dependencies" >&2
            readelf -d hans >&2
            exit 1
          fi
      - name: Test (version, help, connection)
        run: |
          chmod +x scripts/test-hans.sh
          scripts/test-hans.sh ./hans "linux-${{ matrix.label }}"
      - name: Test packaged binary without build dependencies
        run: |
          strip -s hans
          mkdir -p "dist/${{ matrix.label }}"
          cp hans "dist/${{ matrix.label }}/hans"
          cp scripts/test-hans.sh "dist/${{ matrix.label }}/test-hans.sh"
          cp scripts/test-identity-leases.sh "dist/${{ matrix.label }}/test-identity-leases.sh"
          cp scripts/test-userspace.sh "dist/${{ matrix.label }}/test-userspace.sh"
          cp scripts/test-ipv6.sh "dist/${{ matrix.label }}/test-ipv6.sh"
          cp scripts/test-socks5-udp.py "dist/${{ matrix.label }}/test-socks5-udp.py"
          docker run --rm \
            -e HANS_SKIP_CONNECTION_TEST=1 \
            -v "${{ github.workspace }}/dist/${{ matrix.label }}:/product:ro" \
            "${{ matrix.runtime_image }}" \
            sh /product/test-hans.sh /product/hans "linux-${{ matrix.label }}-packaged"
      - name: Test packaged Linux veth fallback
        run: |
          docker run --rm \
            --cap-add NET_ADMIN --cap-add NET_RAW \
            -e HANS_FORCE_VETH=1 \
            -v "${{ github.workspace }}/dist/${{ matrix.label }}:/product:ro" \
            "${{ matrix.runtime_image }}" \
            bash -c '
              set -e
              apt-get update -qq
              apt-get install -y -qq ethtool iproute2
              /product/hans -c 127.0.0.1 -p hans-veth-ci -f -v >/tmp/hans-1.out 2>&1 &
              pid1=$!
              for attempt in 1 2 3 4 5; do
                ip link show hans1 >/dev/null 2>&1 && break
                sleep 1
              done
              ip link show hans1 | grep -q NOARP
              grep -q "^hans.icmp-tunnel/veth/v1/[0-9a-f]\{32\}$" /sys/class/net/hans1/ifalias
              ethtool -k hans1 | tee /tmp/hans1-features
              grep -q "^[[:space:]]*tx-checksum-ip-generic: off" /tmp/hans1-features
              grep -q "^generic-segmentation-offload: off" /tmp/hans1-features

              # An active marked pair must never be reclaimed; the second
              # process must choose the next available name.
              /product/hans -c 127.0.0.1 -p hans-veth-ci -f -v >/tmp/hans-2.out 2>&1 &
              pid2=$!
              for attempt in 1 2 3 4 5; do
                ip link show hans2 >/dev/null 2>&1 && break
                sleep 1
              done
              ip link show hans1 >/dev/null
              ip link show hans2 | grep -q NOARP

              # SIGKILL bypasses normal teardown and intentionally leaves
              # hans1 behind. A later process may reclaim only that precisely
              # marked, reciprocal, inactive pair.
              kill -KILL "$pid1"
              wait "$pid1" 2>/dev/null || true
              ip link show hans1 >/dev/null
              kill "$pid2"
              wait "$pid2" 2>/dev/null || true
              ! ip link show hans2 >/dev/null 2>&1

              /product/hans -c 127.0.0.1 -p hans-veth-ci -f -v >/tmp/hans-3.out 2>&1 &
              pid3=$!
              for attempt in 1 2 3 4 5; do
                grep -q "removing stale Hans veth pair hans1/hansp1" /tmp/hans-3.out &&
                  ip link show hans1 >/dev/null 2>&1 && break
                sleep 1
              done
              grep -q "removing stale Hans veth pair hans1/hansp1" /tmp/hans-3.out
              ip link show hans1 | grep -q NOARP
              kill "$pid3"
              wait "$pid3" 2>/dev/null || true
              ! ip link show hans1 >/dev/null 2>&1

              # A name-compatible but unmarked pair is ambiguous and must be
              # preserved. Hans leaves it alone and chooses hans2.
              ip link add hans1 type veth peer name hansp1
              ip link set dev hans1 arp off
              /product/hans -c 127.0.0.1 -p hans-veth-ci -f -v >/tmp/hans-4.out 2>&1 &
              pid4=$!
              for attempt in 1 2 3 4 5; do
                ip link show hans2 >/dev/null 2>&1 && break
                sleep 1
              done
              ip link show hans1 >/dev/null
              ip link show hans2 | grep -q NOARP
              kill "$pid4"
              wait "$pid4" 2>/dev/null || true
              ip link show hans1 >/dev/null
              ! ip link show hans2 >/dev/null 2>&1
              ip link delete hans1
              ! ip link show hansp1 >/dev/null 2>&1
              ! grep -q "could not create tunnel device" /tmp/hans-1.out /tmp/hans-2.out /tmp/hans-3.out /tmp/hans-4.out
            '
      - name: Test packaged adaptive transport, fallback, and recovery
        if: matrix.label == 'amd64-ubuntu24.04'
        run: |
          docker run --rm --privileged \
            -v "${{ github.workspace }}/dist/${{ matrix.label }}:/product:ro" \
            "${{ matrix.runtime_image }}" \
            bash -c '
              set -eu
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq iproute2 iperf3 iputils-ping net-tools python3 tcpdump
              mkdir -p /dev/net
              if [ ! -c /dev/net/tun ]; then
                mknod /dev/net/tun c 10 200
              fi
              chmod 666 /dev/net/tun

              cleanup() {
                kill "${traffic_pid:-}" "${capture_pid:-}" "${client_pid:-}" "${server_pid:-}" 2>/dev/null || true
                ip netns delete hans-client 2>/dev/null || true
                ip netns delete hans-server 2>/dev/null || true
              }
              diagnostics() {
                status=$?
                if [ "$status" -ne 0 ]; then
                  echo "--- hans server log ---" >&2
                  cat /tmp/hans-server.log >&2 || true
                  echo "--- hans client log ---" >&2
                  cat /tmp/hans-client.log >&2 || true
                fi
                cleanup
                exit "$status"
              }
              trap diagnostics EXIT INT TERM

              wait_for_log() {
                file=$1
                pattern=$2
                attempts=$3
                while [ "$attempts" -gt 0 ]; do
                  grep -q "$pattern" "$file" && return 0
                  kill -0 "$server_pid"
                  kill -0 "$client_pid"
                  sleep 0.5
                  attempts=$((attempts - 1))
                done
                return 1
              }

              ip netns add hans-server
              ip netns add hans-client
              ip link add under-server type veth peer name under-client
              ip link set under-server netns hans-server
              ip link set under-client netns hans-client
              ip -n hans-server link set lo up
              ip -n hans-client link set lo up
              ip -n hans-server addr add 192.0.2.1/24 dev under-server
              ip -n hans-client addr add 192.0.2.2/24 dev under-client
              ip -n hans-server link set under-server up
              ip -n hans-client link set under-client up
              ip netns exec hans-server tc qdisc add dev under-server root netem delay 20ms
              echo_guard_before=$(ip netns exec hans-server cat /proc/sys/net/ipv4/icmp_echo_ignore_all)

              # Server-side --require-v4 accepts v4/v5 but must silently drop
              # an unencrypted v2 request. Ignore the ordinary kernel echo of
              # the request and fail only if a Hans v2 challenge appears.
              ip netns exec hans-server /product/hans \
                -s 10.66.76.0 -p hans-policy-ci --require-v4 -f -v >/tmp/hans-policy-server.log 2>&1 &
              server_pid=$!
              sleep 1
              ip netns exec hans-client python3 - <<PY
          import socket, struct, time
          def checksum(data):
              if len(data) & 1:
                  data += b"\0"
              words = struct.unpack("!%dH" % (len(data) // 2), data)
              total = sum(words)
              total = (total & 0xffff) + (total >> 16)
              total = (total & 0xffff) + (total >> 16)
              return (~total) & 0xffff
          payload = b"hnc2" + bytes([2]) + bytes(40)
          header = struct.pack("!BBHHH", 8, 0, 0, 0x4861, 1)
          packet = header[:2] + struct.pack("!H", checksum(header + payload)) + header[4:] + payload
          sock = socket.socket(socket.AF_INET, socket.SOCK_RAW, socket.IPPROTO_ICMP)
          sock.settimeout(0.25)
          sock.sendto(packet, ("192.0.2.1", 0))
          deadline = time.time() + 2
          while time.time() < deadline:
              try:
                  received = sock.recv(4096)
              except socket.timeout:
                  continue
              ihl = (received[0] & 15) * 4
              answer = received[ihl + 8:]
              if answer.startswith(b"hns2" + bytes([3])):
                  raise SystemExit("require-v4 server answered a legacy request")
          PY
              grep -q "accepting secure protocol v4 or newer only" /tmp/hans-policy-server.log
              kill "$server_pid"
              wait "$server_pid" 2>/dev/null || true
              server_pid=

              ip netns exec hans-server /product/hans \
                -s 10.66.77.0 -p hans-transport-ci --require-v5 -f -v >/tmp/hans-server.log 2>&1 &
              server_pid=$!
              sleep 1

              # A wrong passphrase must not allocate a pending server session
              # or elicit a Hans protocol response. Ordinary kernel echo
              # replies can still exist and are deliberately ignored by v5.
              if ip netns exec hans-client /product/hans \
                -c 192.0.2.1 -p wrong-hans-transport-ci --require-v5 -f -v \
                >/tmp/hans-wrong-key.log 2>&1; then
                echo "wrong-key v5 client unexpectedly connected" >&2
                exit 1
              fi
              grep -q "secure protocol v5 handshake timed out" /tmp/hans-wrong-key.log
              ! grep -q "secure protocol v5 connection established" /tmp/hans-server.log

              # Capture only the negotiation, before bulk traffic makes a
              # ciphertext substring assertion unnecessarily probabilistic.
              ip netns exec hans-server tcpdump -U -i under-server -w /tmp/hans-v5-handshake.pcap icmp \
                >/tmp/hans-tcpdump.log 2>&1 &
              capture_pid=$!
              sleep 0.5
              ip netns exec hans-client /product/hans \
                -c 192.0.2.1 -p hans-transport-ci --require-v5 -m 1400 -f -v >/tmp/hans-client.log 2>&1 &
              client_pid=$!

              connected=0
              for attempt in $(seq 1 20); do
                if ip -n hans-client -4 addr show | grep -q "10.66.77.100/24"; then
                  connected=1
                  break
                fi
                sleep 0.5
              done
              if [ "$connected" -ne 1 ]; then
                cat /tmp/hans-server.log /tmp/hans-client.log
                exit 1
              fi
              kill "$capture_pid"
              wait "$capture_pid" 2>/dev/null || true
              capture_pid=
              [ -s /tmp/hans-v5-handshake.pcap ]
              ! grep -aEq "hanc|hans|hnc2|hns2|hnc3|hns3|hnc4|hns4" \
                /tmp/hans-v5-handshake.pcap
              grep -q "sending protocol v5 connection request" /tmp/hans-client.log
              grep -q "secure protocol v5 connection established" /tmp/hans-server.log

              # Auto mode must discover that this path accepts multiple echo
              # replies and upgrade without a user-specified poll window.
              wait_for_log /tmp/hans-client.log "direct reply mode enabled" 40
              grep -q "transport mode is now direct" /tmp/hans-server.log
              grep -q "lowered server tunnel MTU" /tmp/hans-server.log
              grep -q "negotiated tunnel MTU" /tmp/hans-client.log
              ip netns exec hans-client ping -c 5 -W 2 10.66.77.1

              # Exercise TCP in both directions while using direct replies.
              ip netns exec hans-client iperf3 -s -1 -p 55201 >/tmp/iperf-server.log 2>&1 &
              iperf_pid=$!
              sleep 1
              ip netns exec hans-server iperf3 \
                -c 10.66.77.100 -p 55201 -t 3 --connect-timeout 5000 | tee /tmp/iperf-client.log
              wait "$iperf_pid"
              grep -q "receiver" /tmp/iperf-client.log

              ip netns exec hans-server iperf3 -s -1 -p 55202 >/tmp/iperf-reverse-server.log 2>&1 &
              iperf_pid=$!
              sleep 1
              ip netns exec hans-client iperf3 \
                -c 10.66.77.1 -p 55202 -t 3 --connect-timeout 5000 | tee /tmp/iperf-reverse-client.log
              wait "$iperf_pid"
              grep -q "receiver" /tmp/iperf-reverse-client.log
              # Both directions must exercise the real Linux batch syscalls;
              # this guards against compiling the fallback while silently
              # losing the intended low-risk fast path.
              grep -q "sendmmsg ICMP send batching active" /tmp/hans-server.log
              grep -q "recvmmsg ICMP receive batching active" /tmp/hans-server.log
              grep -q "sendmmsg ICMP send batching active" /tmp/hans-client.log
              grep -q "recvmmsg ICMP receive batching active" /tmp/hans-client.log

              # Drop both underlay directions. The first mode-change request
              # is therefore lost as well: after connectivity returns the
              # client must retry negotiation, not remain stuck in mismatched
              # direct/credit modes.
              ip netns exec hans-server tc qdisc replace dev under-server root netem loss 100%
              ip netns exec hans-client tc qdisc replace dev under-client root netem loss 100%
              wait_for_log /tmp/hans-client.log "falling back to adaptive poll credits" 20
              ip netns exec hans-server tc qdisc replace dev under-server root netem delay 20ms
              ip netns exec hans-client tc qdisc del dev under-client root
              wait_for_log /tmp/hans-server.log "transport mode is now adaptive-credit" 20

              ip netns exec hans-client ping -c 5 -W 2 10.66.77.1
              ip netns exec hans-client iperf3 -s -1 -p 55203 >/tmp/iperf-credit-server.log 2>&1 &
              iperf_pid=$!
              sleep 1
              ip netns exec hans-server iperf3 \
                -c 10.66.77.100 -p 55203 -t 5 --connect-timeout 5000 | tee /tmp/iperf-credit-client.log
              wait "$iperf_pid"
              grep -q "receiver" /tmp/iperf-credit-client.log
              grep -q "adaptive poll target changed" /tmp/hans-client.log

              # The downgrade is not permanent: after a quiet hysteresis
              # interval, a healthy path is probed and upgraded again.
              upgraded=0
              for attempt in $(seq 1 80); do
                if [ "$(grep -c "direct reply mode enabled" /tmp/hans-client.log || true)" -ge 2 ]; then
                  upgraded=1
                  break
                fi
                sleep 0.5
              done
              [ "$upgraded" -eq 1 ]
              ip netns exec hans-client ping -c 3 -W 2 10.66.77.1
              # Credit mode must own the only kernel echo reply, but the
              # namespace-wide setting must be reference-counted and restored
              # after each direct-mode upgrade.
              [ "$(grep -c temporarily.suppressed.kernel.ICMP.echo.replies /tmp/hans-server.log)" -ge 2 ]
              [ "$(grep -c restored.kernel.ICMP.echo.reply.setting /tmp/hans-server.log)" -ge 2 ]
              [ "$(ip netns exec hans-server cat /proc/sys/net/ipv4/icmp_echo_ignore_all)" = "$echo_guard_before" ]

              # Reconnect from the same real IP in fixed direct mode before
              # the old server-side session expires. This exercises session
              # reset and sticky identity assignment rather than only a first
              # connection, and prepares the heartbeat timer regression below.
              old_address=$(ip -n hans-client -o -4 addr show | sed -n "s/.* inet \([^ ]*\).*/\1/p" | grep "^10.66.77.")
              direct_connections_before=$(grep -c "connection established" /tmp/hans-client.log || true)
              kill "$client_pid"
              wait "$client_pid" 2>/dev/null || true
              ip netns exec hans-client /product/hans \
                -c 192.0.2.1 -p hans-transport-ci --require-v5 -m 1400 -w 0 -f -v >>/tmp/hans-client.log 2>&1 &
              client_pid=$!
              reconnected=0
              for attempt in $(seq 1 40); do
                new_address=$(ip -n hans-client -o -4 addr show 2>/dev/null | sed -n "s/.* inet \([^ ]*\).*/\1/p" | grep "^10.66.77." || true)
                direct_connections_now=$(grep -c "connection established" /tmp/hans-client.log || true)
                if [ "$new_address" = "$old_address" ] &&
                   [ "$direct_connections_now" -gt "$direct_connections_before" ]; then
                  reconnected=1
                  break
                fi
                sleep 0.5
              done
              [ "$reconnected" -eq 1 ]
              ip netns exec hans-client ping -c 3 -W 2 10.66.77.1

              # Keep sending TUN traffic across the fixed-direct v5 session
              # while the server disappears. Before the v4 timer fix every
              # send reset the clients next timeout to the legacy 60-second
              # keepalive, so this traffic prevented the 20-second watchdog
              # from reconnecting within the test window.
              #
              # A secure server cannot safely send an unauthenticated RESET for
              # an unknown receiver index. Restart it after the traffic ends
              # and require the authenticated heartbeat watchdog to initiate
              # a fresh handshake without exposing a reset oracle.
              ! grep -q "reconnecting expired secure protocol v5 session" /tmp/hans-client.log
              connections_before=$(grep -c "connection established" /tmp/hans-client.log || true)
              ip netns exec hans-client ping -i 0.05 -w 4 10.66.77.1 >/tmp/hans-heartbeat-traffic.log 2>&1 &
              traffic_pid=$!
              sleep 1
              kill "$server_pid"
              wait "$server_pid" 2>/dev/null || true
              server_pid=
              wait "$traffic_pid" 2>/dev/null || true
              traffic_pid=
              ip netns exec hans-server /product/hans \
                -s 10.66.77.0 -p hans-transport-ci --require-v5 -f -v >>/tmp/hans-server.log 2>&1 &
              server_pid=$!

              session_recovered=0
              for attempt in $(seq 1 100); do
                connections_now=$(grep -c "connection established" /tmp/hans-client.log || true)
                if grep -q "reconnecting expired secure protocol v5 session" /tmp/hans-client.log &&
                   [ "$connections_now" -gt "$connections_before" ]; then
                  session_recovered=1
                  break
                fi
                kill -0 "$server_pid"
                kill -0 "$client_pid"
                sleep 0.5
              done
              [ "$session_recovered" -eq 1 ]
              ip netns exec hans-client ping -c 3 -W 2 10.66.77.1
              kill -0 "$server_pid"
              kill -0 "$client_pid"
            '
      - name: Test packaged unprivileged userspace networking
        if: matrix.label == 'amd64-ubuntu24.04'
        run: |
          docker run --rm --privileged \
            -v "${{ github.workspace }}/dist/${{ matrix.label }}:/product:ro" \
            "${{ matrix.runtime_image }}" \
            bash -c '
              set -e
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
                curl iproute2 iptables python3 util-linux
              sh /product/test-userspace.sh /product/hans
            '
      - name: Test packaged ICMPv6 outer transport
        if: matrix.label == 'amd64-ubuntu24.04'
        run: |
          docker run --rm --privileged \
            -v "${{ github.workspace }}/dist/${{ matrix.label }}:/product:ro" \
            "${{ matrix.runtime_image }}" \
            bash -c '
              set -e
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq iproute2 iputils-ping net-tools
              mkdir -p /dev/net
              if [ ! -c /dev/net/tun ]; then mknod /dev/net/tun c 10 200; fi
              sh /product/test-ipv6.sh /product/hans
            '
      - uses: actions/upload-artifact@v4
        with:
          name: hans-linux-${{ matrix.label }}
          path: dist/${{ matrix.label }}/hans

  # ---------------------------------------------------------------------
  # Emulated Linux CPU architectures via QEMU (docker buildx binfmt).
  # ---------------------------------------------------------------------
  build-linux-emulated:
    name: Linux ${{ matrix.label }} (qemu)
    runs-on: ubuntu-24.04
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/386
            image: i386/debian:bookworm
            label: i386
            experimental: false
          - platform: linux/arm/v7
            image: ubuntu:24.04
            label: armv7
            experimental: false
          - platform: linux/arm64
            image: ubuntu:24.04
            label: arm64-qemu
            experimental: false
          - platform: linux/mips64le
            image: debian:bookworm
            label: mips64le
            experimental: true
          - platform: linux/ppc64le
            image: ubuntu:24.04
            label: ppc64le
            experimental: true
          - platform: linux/riscv64
            image: ubuntu:24.04
            label: riscv64
            experimental: true
          - platform: linux/s390x
            image: ubuntu:24.04
            label: s390x
            experimental: true
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - name: Build & test in ${{ matrix.platform }} container
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            -v "${{ github.workspace }}:/work" -w /work \
            ${{ matrix.image }} bash -c '
              set -e
              apt-get update -qq
              apt-get install -y -qq build-essential
              make test
              make LDFLAGS=-static
              if readelf -d hans 2>/dev/null | grep -q NEEDED; then
                echo "hans unexpectedly has dynamic dependencies" >&2
                readelf -d hans >&2
                exit 1
              fi
              chmod +x scripts/test-hans.sh
              scripts/test-hans.sh ./hans "linux-${{ matrix.label }}"
              strip -s hans
              mkdir -p "dist/${{ matrix.label }}"
              cp hans "dist/${{ matrix.label }}/hans-linux-${{ matrix.label }}"
              cp scripts/test-hans.sh "dist/${{ matrix.label }}/test-hans.sh"
              cp scripts/test-identity-leases.sh "dist/${{ matrix.label }}/test-identity-leases.sh"
            '
      - name: Test packaged binary in a fresh container
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            -e HANS_SKIP_CONNECTION_TEST=1 \
            -v "${{ github.workspace }}/dist/${{ matrix.label }}:/product:ro" \
            ${{ matrix.image }} \
            sh /product/test-hans.sh "/product/hans-linux-${{ matrix.label }}" "linux-${{ matrix.label }}-packaged"
      - uses: actions/upload-artifact@v4
        with:
          name: hans-linux-${{ matrix.label }}
          path: dist/${{ matrix.label }}/hans-linux-${{ matrix.label }}

  # ---------------------------------------------------------------------
  # Linux static musl builds (Alpine + `-static`).
  #
  # All Linux release binaries are fully static. These musl variants avoid
  # glibc-specific behavior as well as its NSS/static-linking caveats, so they
  # are the preferred portable builds for old, embedded, and minimal systems.
  # They have *no* libc version dependency and run on essentially any
  # Linux kernel new enough to support the syscalls hans uses - old
  # distros, musl-based distros (Alpine, postmarketOS, ...), and minimal/
  # embedded systems included.
  # ---------------------------------------------------------------------
  build-linux-musl:
    name: Linux ${{ matrix.label }} (musl static)
    runs-on: ubuntu-24.04
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            label: amd64-musl
            experimental: false
          - platform: linux/arm64
            label: arm64-musl
            experimental: false
          - platform: linux/386
            label: i386-musl
            experimental: false
          - platform: linux/arm/v7
            label: armv7-musl
            experimental: false
          - platform: linux/ppc64le
            label: ppc64le-musl
            experimental: true
          - platform: linux/riscv64
            label: riscv64-musl
            experimental: true
          - platform: linux/s390x
            label: s390x-musl
            experimental: true
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - name: Build & test in ${{ matrix.platform }} alpine (musl) container
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            -v "${{ github.workspace }}:/work" -w /work \
            alpine:3.20 sh -c '
              set -e
              apk add --no-cache build-base linux-headers procps
              make test
              make LDFLAGS=-static
              if readelf -d hans 2>/dev/null | grep -q NEEDED; then
                echo "hans unexpectedly has dynamic dependencies" >&2
                readelf -d hans >&2
                exit 1
              fi
              chmod +x scripts/test-hans.sh
              sh scripts/test-hans.sh ./hans "linux-${{ matrix.label }}"
              strip -s hans
              mkdir -p "dist/${{ matrix.label }}"
              cp hans "dist/${{ matrix.label }}/hans-linux-${{ matrix.label }}"
              cp scripts/test-hans.sh "dist/${{ matrix.label }}/test-hans.sh"
              cp scripts/test-identity-leases.sh "dist/${{ matrix.label }}/test-identity-leases.sh"
              if [ "${{ github.event_name }}" = workflow_dispatch ] && \
                 [ "${{ matrix.label }}" = amd64-musl ]; then
                mkdir -p dist/perf-candidates
                cp "dist/${{ matrix.label }}/hans-linux-${{ matrix.label }}" \
                  dist/perf-candidates/hans-seq-reorder-6x8m

                make clean
                make LDFLAGS=-static \
                  OPTFLAGS="-O2 -fno-strict-aliasing -DHANS_TRANSPORT_REORDER_DELAY_MS=0"
                if readelf -d hans 2>/dev/null | grep -q NEEDED; then
                  echo "seq-6x8m candidate is dynamically linked" >&2
                  exit 1
                fi
                strip -s hans
                cp hans dist/perf-candidates/hans-seq-6x8m

                make clean
                make LDFLAGS=-static \
                  OPTFLAGS="-O2 -fno-strict-aliasing -DHANS_SEQUENTIAL_ECHO_SEQUENCE=0 -DHANS_TRANSPORT_REORDER_DELAY_MS=0 -DHANS_TCP_RX_WINDOW=2097152 -DHANS_TCP_TX_WINDOW=2097152 -DHANS_TCP_SEND_QUEUE_LENGTH=4096"
                if readelf -d hans 2>/dev/null | grep -q NEEDED; then
                  echo "compat-2m candidate is dynamically linked" >&2
                  exit 1
                fi
                strip -s hans
                cp hans dist/perf-candidates/hans-compat-2m
                cp scripts/test-hans.sh dist/perf-candidates/test-hans.sh
                cp scripts/test-identity-leases.sh \
                  dist/perf-candidates/test-identity-leases.sh
              fi
            '
      - name: Test packaged binary in a fresh Alpine container
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            -e HANS_SKIP_CONNECTION_TEST=1 \
            -v "${{ github.workspace }}/dist/${{ matrix.label }}:/product:ro" \
            alpine:3.20 \
            sh /product/test-hans.sh "/product/hans-linux-${{ matrix.label }}" "linux-${{ matrix.label }}-packaged"
      - name: Test performance candidates in a fresh Alpine container
        if: github.event_name == 'workflow_dispatch' && matrix.label == 'amd64-musl'
        run: |
          for candidate in compat-2m seq-6x8m seq-reorder-6x8m; do
            docker run --rm --platform linux/amd64 \
              -e HANS_SKIP_CONNECTION_TEST=1 \
              -v "${{ github.workspace }}/dist/perf-candidates:/product:ro" \
              alpine:3.20 \
              sh /product/test-hans.sh "/product/hans-$candidate" "candidate-$candidate"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: hans-linux-${{ matrix.label }}
          path: dist/${{ matrix.label }}/hans-linux-${{ matrix.label }}
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && matrix.label == 'amd64-musl'
        with:
          name: hans-linux-amd64-perf-candidates
          path: |
            dist/perf-candidates/hans-compat-2m
            dist/perf-candidates/hans-seq-6x8m
            dist/perf-candidates/hans-seq-reorder-6x8m

  # ---------------------------------------------------------------------
  # macOS: Intel (x86_64) and Apple Silicon (arm64).
  # ---------------------------------------------------------------------
  build-macos:
    name: macOS ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            label: amd64
          - os: macos-14
            label: arm64
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          make test
          make
      - name: Test (version, help, connection)
        run: |
          chmod +x scripts/test-hans.sh
          scripts/test-hans.sh ./hans "macos-${{ matrix.label }}"
      - name: Test packaged binary with a minimal environment
        run: |
          strip -S -x hans
          mkdir -p "dist/${{ matrix.label }}"
          cp hans "dist/${{ matrix.label }}/hans"
          cp scripts/test-hans.sh "dist/${{ matrix.label }}/test-hans.sh"
          cp scripts/test-identity-leases.sh "dist/${{ matrix.label }}/test-identity-leases.sh"
          unexpected="$({ otool -L "dist/${{ matrix.label }}/hans" | tail -n +2 || true; } |
            awk '{ print $1 }' |
            grep -Ev '^(/usr/lib/|/System/Library/)' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected non-system macOS dependencies:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          env -i \
            PATH=/usr/bin:/bin:/usr/sbin:/sbin \
            HOME="$RUNNER_TEMP" \
            TMPDIR="$RUNNER_TEMP" \
            HANS_SKIP_CONNECTION_TEST=1 \
            sh "$(pwd)/dist/${{ matrix.label }}/test-hans.sh" \
              "$(pwd)/dist/${{ matrix.label }}/hans" "macos-${{ matrix.label }}-packaged"
          state="$RUNNER_TEMP/hans-userspace-${{ matrix.label }}"
          mkdir -p "$state"
          HANS_STATE_DIR="$state" "$(pwd)/dist/${{ matrix.label }}/hans" \
            -c 127.0.0.1 -p userspace-smoke -f -v \
            --feature userspace --socks5 127.0.0.1:19080 \
            >"$state/stdout" 2>"$state/stderr" &
          userspace_pid=$!
          sleep 2
          kill "$userspace_pid"
          wait "$userspace_pid" 2>/dev/null || true
          grep -q "using unprivileged ICMP ping socket" "$state/stderr"
          grep -q "SOCKS5 listening on 127.0.0.1:19080" "$state/stderr"
          ! grep -q "opened tunnel device" "$state/stderr"
      - uses: actions/upload-artifact@v4
        with:
          name: hans-macos-${{ matrix.label }}
          path: dist/${{ matrix.label }}/hans

  # ---------------------------------------------------------------------
  # Windows via Cygwin (amd64 + legacy i386).
  #
  # NOTE on arm64: Cygwin has never shipped an arm64/aarch64 port (it only
  # builds for x86_64 and, historically, x86). There is therefore no Cygwin
  # toolchain or cygwin1.dll runtime available for Windows-on-ARM, so a
  # windows-11-arm job is not possible without porting hans away from Cygwin
  # entirely (e.g. to MSYS2/MinGW-w64 and rewriting the POSIX-only calls
  # such as syslog()/daemon()/getaddrinfo() it relies on). Out of scope here.
  # ---------------------------------------------------------------------
  build-windows:
    name: Windows ${{ matrix.arch }} (cygwin)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            cygwin_root: C:\tools\cygwin
            wintun_arch: amd64
            maintained: true
          # Cygwin 3.3.6 is the final x86 release. Build against Cygwin's
          # official frozen 2022 archive and run it under WOW64.
          - arch: i386
            cygwin_root: C:\tools\cygwin32
            wintun_arch: x86
            maintained: false
    steps:
      - uses: actions/checkout@v4
      - name: Install maintained Cygwin toolchain
        if: matrix.maintained
        uses: egor-tensin/setup-cygwin@v4
        with:
          packages: gcc-g++ make libiconv-devel libintl-devel
          install-dir: ${{ matrix.cygwin_root }}
      - name: Install archived 32-bit Cygwin toolchain
        if: ${{ !matrix.maintained }}
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'setup-x86.exe'
          Invoke-WebRequest 'https://cygwin.com/setup-x86.exe' -OutFile $setup
          $cache = Join-Path $env:RUNNER_TEMP 'cygwin32-cache'
          $arguments = @(
            '--quiet-mode',
            '--no-desktop',
            '--no-shortcuts',
            '--no-startmenu',
            '--allow-unsupported-windows',
            '--root', '${{ matrix.cygwin_root }}',
            '--local-package-dir', $cache,
            '--site', 'https://mirrors.kernel.org/sourceware/cygwin-archive/20221123/',
            '--packages', 'gcc-g++,make,libiconv-devel,libintl-devel'
          )
          $process = Start-Process -FilePath $setup -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "32-bit Cygwin setup failed with exit code $($process.ExitCode)"
          }
      - name: Fetch verified official Wintun runtime
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'wintun-0.14.1.zip'
          Invoke-WebRequest 'https://www.wintun.net/builds/wintun-0.14.1.zip' -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          $expected = '07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51'
          if ($actual -ne $expected) {
            throw "Wintun archive checksum mismatch: $actual"
          }
          $expanded = Join-Path $env:RUNNER_TEMP 'wintun-0.14.1'
          Expand-Archive -LiteralPath $archive -DestinationPath $expanded
          Copy-Item (Join-Path $expanded 'wintun\bin\${{ matrix.wintun_arch }}\wintun.dll') `
            (Join-Path $env:GITHUB_WORKSPACE 'wintun.dll')
          Copy-Item (Join-Path $expanded 'wintun\LICENSE.txt') `
            (Join-Path $env:GITHUB_WORKSPACE 'WINTUN-LICENSE.txt')
      - name: Build, test, and verify static runtime linkage
        shell: pwsh
        run: |
          $bash = Join-Path '${{ matrix.cygwin_root }}' 'bin\bash.exe'
          $cygpath = Join-Path '${{ matrix.cygwin_root }}' 'bin\cygpath.exe'
          $script = (& $cygpath -u (Join-Path $env:GITHUB_WORKSPACE 'scripts\build-windows-cygwin.sh') | Out-String).Trim()
          & $bash --login -eo pipefail -o igncr `
            $script `
            '${{ matrix.arch }}'
          if ($LASTEXITCODE -ne 0) {
            throw "Windows ${{ matrix.arch }} build failed with exit code $LASTEXITCODE"
          }
      - name: Test packaged executable from PowerShell
        shell: pwsh
        run: |
          $product = Join-Path $env:GITHUB_WORKSPACE 'dist\windows-${{ matrix.arch }}'
          $state = Join-Path $env:RUNNER_TEMP 'hans-packaged-state-${{ matrix.arch }}'
          New-Item -ItemType Directory -Force $state | Out-Null

          # Resolve the test state path before deleting Cygwin. Then remove the
          # complete compiler/runtime environment, not merely its PATH entry.
          $cygpath = Join-Path '${{ matrix.cygwin_root }}' 'bin\cygpath.exe'
          $statePosix = (& $cygpath -u $state | Out-String).Trim()
          Remove-Item -LiteralPath '${{ matrix.cygwin_root }}' -Recurse -Force
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $env:HANS_STATE_DIR = $statePosix

          $exe = Join-Path $product 'hans.exe'
          $output = (& $exe 2>&1 | Out-String)
          $exitCode = $LASTEXITCODE
          if ($output -notmatch 'IP over ICMP version') {
            $files = (Get-ChildItem $product | Select-Object -ExpandProperty Name) -join ', '
            throw "Packaged hans.exe did not start from PowerShell (exit $exitCode; files: $files). Output: $output"
          }

          $id1 = (& $exe --show-device-id | Out-String).Trim()
          $id2 = (& $exe --show-device-id | Out-String).Trim()
          if ($id1 -notmatch '^[0-9a-f]{32}$' -or $id1 -ne $id2) {
            throw "Packaged hans.exe failed persistent device ID test: '$id1' / '$id2'"
          }

          # A native Windows launch must remain writable even when Cygwin HOME
          # is absent or points at its read-only root directory.
          Remove-Item Env:HANS_STATE_DIR
          $env:HOME = '/'
          $defaultId = (& $exe --show-device-id | Out-String).Trim()
          $defaultStateFile = Join-Path $env:LOCALAPPDATA 'Hans\device-id'
          if ($defaultId -notmatch '^[0-9a-f]{32}$' -or
              -not (Test-Path -LiteralPath $defaultStateFile)) {
            throw "Packaged hans.exe did not use native Windows state directory"
          }
          $identity1 = (& $exe --show-identity | Out-String).Trim()
          $identity2 = (& $exe --show-identity | Out-String).Trim()
          $defaultIdentityFile = Join-Path $env:LOCALAPPDATA 'Hans\identity.key'
          if ($identity1 -notmatch '^[0-9a-f]{32}$' -or
              $identity1 -ne $identity2 -or
              -not (Test-Path -LiteralPath $defaultIdentityFile)) {
            throw "Packaged hans.exe failed native Windows identity reload test"
          }
          $env:HANS_STATE_DIR = $statePosix

          $leaseWindows = Join-Path $state 'leases'
          "$id1 167772260 1785484800 1 3405803796" | Set-Content -Encoding ascii $leaseWindows
          $leasePosix = "$statePosix/leases"
          $peers = (& $exe --list-peers --lease-file $leasePosix | Out-String)
          if ($peers -notmatch [regex]::Escape($id1) -or $peers -notmatch '10\.0\.0\.100' -or $peers -notmatch 'online') {
            throw "Packaged hans.exe failed peer-list test: $peers"
          }

          # Userspace mode must start through the Windows ICMP Helper API and
          # must not load or create a TAP/Wintun adapter.
          $userOut = Join-Path $state 'userspace.out'
          $userErr = Join-Path $state 'userspace.err'
          $userProbe = Start-Process -FilePath $exe `
            -ArgumentList @('-c', '127.0.0.1', '-p', 'hans-userspace-ci', '-f', '-v', '--feature', 'userspace', '--socks5', '127.0.0.1:19080') `
            -RedirectStandardOutput $userOut `
            -RedirectStandardError $userErr `
            -PassThru
          Start-Sleep -Seconds 3
          if ($userProbe.HasExited) {
            $userText = (Get-Content $userOut, $userErr -Raw -ErrorAction SilentlyContinue) -join "`n"
            throw "Packaged userspace client exited unexpectedly: $userText"
          }
          $userProbe.Kill($true)
          $userProbe.WaitForExit()
          $userText = (Get-Content $userOut, $userErr -Raw -ErrorAction SilentlyContinue) -join "`n"
          if ($userText -notmatch 'using Windows ICMP helper API' -or
              $userText -notmatch 'SOCKS5 listening on 127\.0\.0\.1:19080' -or
              $userText -match 'TAP|Wintun|tunnel device') {
            throw "Packaged userspace mode did not remain adapter-free: $userText"
          }

          # Exercise the stripped package after the full toolchain has been
          # removed. With no TAP adapter, the bundled Wintun fallback must
          # create an adapter and keep the client alive long enough to connect.
          $probeOut = Join-Path $state 'tun-probe.out'
          $probeErr = Join-Path $state 'tun-probe.err'
          $probe = Start-Process -FilePath $exe `
            -ArgumentList @('-c', '127.0.0.1', '-p', 'hans-ci-probe', '-f', '-v') `
            -RedirectStandardOutput $probeOut `
            -RedirectStandardError $probeErr `
            -PassThru
          if (-not $probe.WaitForExit(5000)) {
            $probe.Kill($true)
            $probe.WaitForExit()
          }
          $probeText = (Get-Content $probeOut, $probeErr -Raw -ErrorAction SilentlyContinue) -join "`n"
          if ($probeText -match 'creating socket pair|Protocol not supported|could not create tunnel device|loading wintun.dll fallback|opening or creating Wintun adapter') {
            throw "Packaged hans.exe failed tunnel adapter initialization: $probeText"
          }
          # No arguments intentionally prints usage and exits non-zero.
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: hans-windows-${{ matrix.arch }}-cygwin
          path: |
            dist/windows-${{ matrix.arch }}/hans.exe
            dist/windows-${{ matrix.arch }}/cygwin1.dll
            dist/windows-${{ matrix.arch }}/wintun.dll
            dist/windows-${{ matrix.arch }}/WINTUN-LICENSE.txt
            dist/windows-${{ matrix.arch }}/LWIP-LICENSE.txt

  # ---------------------------------------------------------------------
  # FreeBSD: amd64, aarch64, riscv64, powerpc64 across kernel releases.
  # ---------------------------------------------------------------------
  build-freebsd:
    name: FreeBSD ${{ matrix.release }} ${{ matrix.arch }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: "15.1"
            arch: amd64
            experimental: false
          - release: "15.1"
            arch: aarch64
            experimental: true
          - release: "15.1"
            arch: riscv64
            experimental: true
          - release: "15.1"
            arch: powerpc64
            experimental: true
          - release: "14.2"
            arch: amd64
            experimental: false
    steps:
      - uses: actions/checkout@v4
      - name: Build & test in FreeBSD ${{ matrix.release }} (${{ matrix.arch }})
        uses: vmactions/freebsd-vm@v1
        with:
          release: ${{ matrix.release }}
          arch: ${{ matrix.arch }}
          usesh: true
          sync: ${{ (matrix.arch == 'riscv64' || matrix.arch == 'powerpc64') && 'scp' || 'rsync' }}
          prepare: |
            true
          run: |
            cd $GITHUB_WORKSPACE
            make test GCC=cc GPP=c++
            make GCC=cc GPP=c++ LDFLAGS=-static
            chmod +x scripts/test-hans.sh
            sh scripts/test-hans.sh ./hans "freebsd-${{ matrix.release }}-${{ matrix.arch }}"
            strip -s hans
            product="$GITHUB_WORKSPACE/dist/freebsd-${{ matrix.release }}-${{ matrix.arch }}"
            mkdir -p "$product"
            cp hans "$product/hans-freebsd-${{ matrix.release }}-${{ matrix.arch }}"
            cp scripts/test-hans.sh "$product/test-hans.sh"
            cp scripts/test-identity-leases.sh "$product/test-identity-leases.sh"
            file "$product/hans-freebsd-${{ matrix.release }}-${{ matrix.arch }}" | grep -qi 'statically linked'
            env -i PATH=/bin:/usr/bin:/sbin:/usr/sbin HOME=/tmp TMPDIR=/tmp HANS_SKIP_CONNECTION_TEST=1 \
              sh "$product/test-hans.sh" \
              "$product/hans-freebsd-${{ matrix.release }}-${{ matrix.arch }}" \
              "freebsd-${{ matrix.release }}-${{ matrix.arch }}-packaged"
      - uses: actions/upload-artifact@v4
        with:
          name: hans-freebsd-${{ matrix.release }}-${{ matrix.arch }}
          path: dist/freebsd-${{ matrix.release }}-${{ matrix.arch }}/hans-freebsd-${{ matrix.release }}-${{ matrix.arch }}

  # ---------------------------------------------------------------------
  # OpenBSD: amd64, aarch64, riscv64 across kernel releases.
  # ---------------------------------------------------------------------
  build-openbsd:
    name: OpenBSD ${{ matrix.release }} ${{ matrix.arch }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: "7.9"
            arch: amd64
            experimental: false
          - release: "7.9"
            arch: aarch64
            experimental: true
          - release: "7.9"
            arch: riscv64
            experimental: true
          - release: "7.6"
            arch: amd64
            experimental: false
    steps:
      - uses: actions/checkout@v4
      - name: Build & test in OpenBSD ${{ matrix.release }} (${{ matrix.arch }})
        uses: vmactions/openbsd-vm@v1
        with:
          release: ${{ matrix.release }}
          arch: ${{ matrix.arch }}
          usesh: true
          prepare: |
            true
          run: |
            cd $GITHUB_WORKSPACE
            make test GCC=cc GPP=c++
            make GCC=cc GPP=c++ LDFLAGS=-static
            chmod +x scripts/test-hans.sh
            sh scripts/test-hans.sh ./hans "openbsd-${{ matrix.release }}-${{ matrix.arch }}"
            strip -s hans
            product="$GITHUB_WORKSPACE/dist/openbsd-${{ matrix.release }}-${{ matrix.arch }}"
            mkdir -p "$product"
            cp hans "$product/hans-openbsd-${{ matrix.release }}-${{ matrix.arch }}"
            cp scripts/test-hans.sh "$product/test-hans.sh"
            cp scripts/test-identity-leases.sh "$product/test-identity-leases.sh"
            ldd "$product/hans-openbsd-${{ matrix.release }}-${{ matrix.arch }}" >/tmp/hans-ldd.txt 2>&1 || true
            if grep -Eq '=>|/usr/lib/.*\.so' /tmp/hans-ldd.txt; then
              echo "OpenBSD package unexpectedly has dynamic dependencies:" >&2
              cat /tmp/hans-ldd.txt >&2
              exit 1
            fi
            env -i PATH=/bin:/usr/bin:/sbin:/usr/sbin HOME=/tmp TMPDIR=/tmp HANS_SKIP_CONNECTION_TEST=1 \
              sh "$product/test-hans.sh" \
              "$product/hans-openbsd-${{ matrix.release }}-${{ matrix.arch }}" \
              "openbsd-${{ matrix.release }}-${{ matrix.arch }}-packaged"
      - uses: actions/upload-artifact@v4
        with:
          name: hans-openbsd-${{ matrix.release }}-${{ matrix.arch }}
          path: dist/openbsd-${{ matrix.release }}-${{ matrix.arch }}/hans-openbsd-${{ matrix.release }}-${{ matrix.arch }}

  # ---------------------------------------------------------------------
  # NetBSD: amd64, aarch64, riscv64 across kernel releases.
  # ---------------------------------------------------------------------
  build-netbsd:
    name: NetBSD ${{ matrix.release }} ${{ matrix.arch }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: "11.0"
            arch: amd64
            experimental: false
          - release: "11.0"
            arch: aarch64
            experimental: true
          # riscv64 excluded: the vmactions NetBSD riscv64 VM never reaches a
          # usable state on GitHub-hosted runners (boots but hangs before ssh
          # is reachable), so the job cannot finish.
          - release: "10.1"
            arch: amd64
            experimental: false
          - release: "9.4"
            arch: amd64
            experimental: true
    steps:
      - uses: actions/checkout@v4
      - name: Build & test in NetBSD ${{ matrix.release }} (${{ matrix.arch }})
        uses: vmactions/netbsd-vm@v1
        with:
          release: ${{ matrix.release }}
          arch: ${{ matrix.arch }}
          usesh: true
          prepare: |
            true
          run: |
            cd $GITHUB_WORKSPACE
            make test GCC=cc GPP=c++
            make GCC=cc GPP=c++ LDFLAGS=-static
            chmod +x scripts/test-hans.sh
            sh scripts/test-hans.sh ./hans "netbsd-${{ matrix.release }}-${{ matrix.arch }}"
            strip -s hans
            product="$GITHUB_WORKSPACE/dist/netbsd-${{ matrix.release }}-${{ matrix.arch }}"
            mkdir -p "$product"
            cp hans "$product/hans-netbsd-${{ matrix.release }}-${{ matrix.arch }}"
            cp scripts/test-hans.sh "$product/test-hans.sh"
            cp scripts/test-identity-leases.sh "$product/test-identity-leases.sh"
            file "$product/hans-netbsd-${{ matrix.release }}-${{ matrix.arch }}" | grep -qi 'statically linked'
            env -i PATH=/bin:/usr/bin:/sbin:/usr/sbin HOME=/tmp TMPDIR=/tmp HANS_SKIP_CONNECTION_TEST=1 \
              sh "$product/test-hans.sh" \
              "$product/hans-netbsd-${{ matrix.release }}-${{ matrix.arch }}" \
              "netbsd-${{ matrix.release }}-${{ matrix.arch }}-packaged"
      - uses: actions/upload-artifact@v4
        with:
          name: hans-netbsd-${{ matrix.release }}-${{ matrix.arch }}
          path: dist/netbsd-${{ matrix.release }}-${{ matrix.arch }}/hans-netbsd-${{ matrix.release }}-${{ matrix.arch }}

  # ---------------------------------------------------------------------
  # Automatically publish a GitHub Release with every built binary.
  # ---------------------------------------------------------------------
  release:
    name: Publish release
    # Do not replace the continuous release with a partial artifact set when
    # any required build or isolated-package test failed.
    # A manual dispatch is a validation run and may target a feature branch;
    # only repository pushes are allowed to mutate the rolling/formal release.
    if: github.event_name == 'push'
    needs:
      - build-linux-native
      - build-linux-emulated
      - build-linux-musl
      - build-macos
      - build-windows
      - build-freebsd
      - build-openbsd
      - build-netbsd
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten artifacts
        run: |
          mkdir -p release
          for d in artifacts/*/; do
            name="$(basename "$d")"
            if [[ "$name" == hans-windows-*-cygwin ]]; then
              # Keep the executable and its runtime dependency under the exact
              # filenames required by the Windows loader. Publishing them as
              # separately prefixed release assets breaks Cygwin startup
              # because the loader looks specifically for "cygwin1.dll".
              (
                cd "$d"
                zip -q "$GITHUB_WORKSPACE/release/$name.zip" \
                  hans.exe cygwin1.dll wintun.dll WINTUN-LICENSE.txt \
                  LWIP-LICENSE.txt
              )
              continue
            fi
            for f in "$d"*; do
              [ -f "$f" ] || continue
              fname="$(basename "$f")"
              if [ "$fname" = "$name" ]; then
                cp "$f" "release/$name"
              else
                cp "$f" "release/$name-$fname"
              fi
            done
          done
          cp third_party/lwip/COPYING release/LWIP-LICENSE.txt
          ls -la release

      - name: Determine release tag
        id: tag
        env:
          GIT_REF: ${{ github.ref }}
        run: |
          if [[ "$GIT_REF" == refs/tags/* ]]; then
            tag="${GIT_REF#refs/tags/}"
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
              echo "formal release tags must use SemVer, for example v1.5.1 or v1.6.0-rc.1" >&2
              exit 1
            fi
            version="${tag#v}"
            source_version="${version%%-*}"
            grep -Fq "Hans - IP over ICMP version $source_version" src/main.cpp
            grep -Fq "Release $source_version (" CHANGES
            prerelease=false
            [[ "$version" == *-* ]] && prerelease=true
            {
              echo "tag=$tag"
              echo "version=$source_version"
              echo "prerelease=$prerelease"
              echo "name=Hans $tag"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "tag=latest"
              echo "version="
              echo "prerelease=true"
              echo "name=Hans continuous build (${GITHUB_SHA::7})"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Build release notes
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          RELEASE_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          if [[ -n "$RELEASE_VERSION" ]]; then
            {
              echo "## Highlights"
              echo
              awk -v prefix="Release $RELEASE_VERSION (" '
                /^Release / {
                  if (found) exit
                  if (index($0, prefix) == 1) {
                    found = 1
                    next
                  }
                }
                found && /^-+$/ { next }
                found { print }
                END { if (!found) exit 2 }
              ' CHANGES

              previous_tag=$(git tag --merged HEAD --list 'v[0-9]*.[0-9]*.[0-9]*' \
                --sort=-version:refname | grep -Fvx "$RELEASE_TAG" | head -1 || true)
              echo
              echo "## Links"
              echo
              if [[ -n "$previous_tag" ]]; then
                echo "- [Full commit comparison](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${previous_tag}...${RELEASE_TAG})"
              else
                echo "- [Complete commit history](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG})"
              fi
              echo "- [Installation and usage guide](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${RELEASE_TAG}/README.md)"
            } > release-notes.md
          else
            subject=$(git log -1 --pretty=%s)
            {
              echo "Automated prerelease built from [\`${GITHUB_SHA::7}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}): $subject"
              echo
              echo "This rolling release is replaced after every successful complete build matrix. Use the [latest stable release](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/latest) for production deployments."
            } > release-notes.md
          fi
          cat release-notes.md

      - name: Publish continuous GitHub Release
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.tag.outputs.name }}
          prerelease: ${{ steps.tag.outputs.prerelease }}
          make_latest: ${{ steps.tag.outputs.prerelease == 'false' }}
          generate_release_notes: true
          files: release/*

      - name: Publish formal GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.name }}
          prerelease: ${{ steps.tag.outputs.prerelease }}
          make_latest: ${{ steps.tag.outputs.prerelease == 'false' }}
          body_path: release-notes.md
          append_body: false
          generate_release_notes: false
          files: release/*
