name: Build, Test & Release

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------
  # Native Linux runners: several kernel/distro versions, amd64 + arm64.
  # ---------------------------------------------------------------------
  build-linux-native:
    name: Linux ${{ matrix.label }} (native)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: amd64-ubuntu22.04
          - os: ubuntu-24.04
            label: amd64-ubuntu24.04
          - os: ubuntu-24.04-arm
            label: arm64-ubuntu24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential net-tools
      - name: Build
        run: make
      - name: Test (version, help, connection)
        run: |
          chmod +x scripts/test-hans.sh
          scripts/test-hans.sh ./hans "linux-${{ matrix.label }}"
      - uses: actions/upload-artifact@v4
        with:
          name: hans-linux-${{ matrix.label }}
          path: hans

  # ---------------------------------------------------------------------
  # Emulated Linux CPU architectures via QEMU (docker buildx binfmt).
  # ---------------------------------------------------------------------
  build-linux-emulated:
    name: Linux ${{ matrix.label }} (qemu)
    runs-on: ubuntu-24.04
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/386
            image: i386/debian:bookworm
            label: i386
            experimental: false
          - platform: linux/arm/v7
            image: ubuntu:24.04
            label: armv7
            experimental: false
          - platform: linux/arm64
            image: ubuntu:24.04
            label: arm64-qemu
            experimental: false
          - platform: linux/mips64le
            image: ubuntu:24.04
            label: mips64le
            experimental: true
          - platform: linux/ppc64le
            image: ubuntu:24.04
            label: ppc64le
            experimental: true
          - platform: linux/riscv64
            image: ubuntu:24.04
            label: riscv64
            experimental: true
          - platform: linux/s390x
            image: ubuntu:24.04
            label: s390x
            experimental: true
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - name: Build & test in ${{ matrix.platform }} container
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            -v "${{ github.workspace }}:/work" -w /work \
            ${{ matrix.image }} bash -c '
              set -e
              apt-get update -qq
              apt-get install -y -qq build-essential
              make
              chmod +x scripts/test-hans.sh
              scripts/test-hans.sh ./hans "linux-${{ matrix.label }}"
              cp hans "hans-linux-${{ matrix.label }}"
            '
      - uses: actions/upload-artifact@v4
        with:
          name: hans-linux-${{ matrix.label }}
          path: hans-linux-${{ matrix.label }}

  # ---------------------------------------------------------------------
  # macOS: Intel (x86_64) and Apple Silicon (arm64).
  # ---------------------------------------------------------------------
  build-macos:
    name: macOS ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-13
            label: amd64
          - os: macos-14
            label: arm64
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make
      - name: Test (version, help, connection)
        run: |
          chmod +x scripts/test-hans.sh
          scripts/test-hans.sh ./hans "macos-${{ matrix.label }}"
      - uses: actions/upload-artifact@v4
        with:
          name: hans-macos-${{ matrix.label }}
          path: hans

  # ---------------------------------------------------------------------
  # Windows via Cygwin (amd64).
  # ---------------------------------------------------------------------
  build-windows:
    name: Windows amd64 (cygwin)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Cygwin toolchain
        uses: egor-tensin/setup-cygwin@v4
        with:
          packages: gcc-g++ make
      - name: Build
        shell: C:\tools\cygwin\bin\bash.exe --login -eo pipefail -o igncr '{0}'
        run: |
          cd "$(cygpath -u '${{ github.workspace }}')"
          make CPPFLAGS='-c -g -std=gnu++98 -fpermissive -Wall -Wextra -Wno-sign-compare -Wno-missing-field-initializers -DWIN32'
          if [ -f hans.exe ]; then cp hans.exe hans; fi
      - name: Test (version, help, connection)
        shell: C:\tools\cygwin\bin\bash.exe --login -eo pipefail -o igncr '{0}'
        run: |
          cd "$(cygpath -u '${{ github.workspace }}')"
          chmod +x scripts/test-hans.sh
          BIN=hans
          [ -f hans.exe ] && BIN=hans.exe
          ./scripts/test-hans.sh "./$BIN" "windows-amd64-cygwin"
      - uses: actions/upload-artifact@v4
        with:
          name: hans-windows-amd64-cygwin
          path: |
            hans.exe
            hans

  # ---------------------------------------------------------------------
  # FreeBSD: amd64, aarch64, riscv64, powerpc64 across kernel releases.
  # ---------------------------------------------------------------------
  build-freebsd:
    name: FreeBSD ${{ matrix.release }} ${{ matrix.arch }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: "15.1"
            arch: amd64
            experimental: false
          - release: "15.1"
            arch: aarch64
            experimental: true
          - release: "15.1"
            arch: riscv64
            experimental: true
          - release: "15.1"
            arch: powerpc64
            experimental: true
          - release: "14.2"
            arch: amd64
            experimental: false
    steps:
      - uses: actions/checkout@v4
      - name: Build & test in FreeBSD ${{ matrix.release }} (${{ matrix.arch }})
        uses: vmactions/freebsd-vm@v1
        with:
          release: ${{ matrix.release }}
          arch: ${{ matrix.arch }}
          usesh: true
          sync: ${{ (matrix.arch == 'riscv64' || matrix.arch == 'powerpc64') && 'scp' || 'rsync' }}
          prepare: |
            true
          run: |
            cd $GITHUB_WORKSPACE
            make GCC=cc GPP=c++
            chmod +x scripts/test-hans.sh
            sh scripts/test-hans.sh ./hans "freebsd-${{ matrix.release }}-${{ matrix.arch }}"
            cp hans "hans-freebsd-${{ matrix.release }}-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: hans-freebsd-${{ matrix.release }}-${{ matrix.arch }}
          path: hans-freebsd-${{ matrix.release }}-${{ matrix.arch }}

  # ---------------------------------------------------------------------
  # OpenBSD: amd64, aarch64, riscv64 across kernel releases.
  # ---------------------------------------------------------------------
  build-openbsd:
    name: OpenBSD ${{ matrix.release }} ${{ matrix.arch }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: "7.9"
            arch: amd64
            experimental: false
          - release: "7.9"
            arch: aarch64
            experimental: true
          - release: "7.9"
            arch: riscv64
            experimental: true
          - release: "7.6"
            arch: amd64
            experimental: false
    steps:
      - uses: actions/checkout@v4
      - name: Build & test in OpenBSD ${{ matrix.release }} (${{ matrix.arch }})
        uses: vmactions/openbsd-vm@v1
        with:
          release: ${{ matrix.release }}
          arch: ${{ matrix.arch }}
          usesh: true
          prepare: |
            true
          run: |
            cd $GITHUB_WORKSPACE
            make GCC=cc GPP=c++
            chmod +x scripts/test-hans.sh
            sh scripts/test-hans.sh ./hans "openbsd-${{ matrix.release }}-${{ matrix.arch }}"
            cp hans "hans-openbsd-${{ matrix.release }}-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: hans-openbsd-${{ matrix.release }}-${{ matrix.arch }}
          path: hans-openbsd-${{ matrix.release }}-${{ matrix.arch }}

  # ---------------------------------------------------------------------
  # NetBSD: amd64, aarch64, riscv64 across kernel releases.
  # ---------------------------------------------------------------------
  build-netbsd:
    name: NetBSD ${{ matrix.release }} ${{ matrix.arch }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: "11.0"
            arch: amd64
            experimental: false
          - release: "11.0"
            arch: aarch64
            experimental: true
          - release: "11.0"
            arch: riscv64
            experimental: true
          - release: "10.1"
            arch: amd64
            experimental: false
          - release: "9.4"
            arch: amd64
            experimental: true
    steps:
      - uses: actions/checkout@v4
      - name: Build & test in NetBSD ${{ matrix.release }} (${{ matrix.arch }})
        uses: vmactions/netbsd-vm@v1
        with:
          release: ${{ matrix.release }}
          arch: ${{ matrix.arch }}
          usesh: true
          prepare: |
            true
          run: |
            cd $GITHUB_WORKSPACE
            make GCC=cc GPP=c++
            chmod +x scripts/test-hans.sh
            sh scripts/test-hans.sh ./hans "netbsd-${{ matrix.release }}-${{ matrix.arch }}"
            cp hans "hans-netbsd-${{ matrix.release }}-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: hans-netbsd-${{ matrix.release }}-${{ matrix.arch }}
          path: hans-netbsd-${{ matrix.release }}-${{ matrix.arch }}

  # ---------------------------------------------------------------------
  # Automatically publish a GitHub Release with every built binary.
  # ---------------------------------------------------------------------
  release:
    name: Publish release
    if: always() && github.event_name != 'pull_request'
    needs:
      - build-linux-native
      - build-linux-emulated
      - build-macos
      - build-windows
      - build-freebsd
      - build-openbsd
      - build-netbsd
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten artifacts
        run: |
          mkdir -p release
          for d in artifacts/*/; do
            name="$(basename "$d")"
            for f in "$d"*; do
              [ -f "$f" ] || continue
              fname="$(basename "$f")"
              if [ "$fname" = "$name" ]; then
                cp "$f" "release/$name"
              else
                cp "$f" "release/$name-$fname"
              fi
            done
          done
          ls -la release

      - name: Determine release tag
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "name=hans ${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "name=Continuous build (${GITHUB_SHA::7})" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.name }}
          prerelease: ${{ steps.tag.outputs.prerelease }}
          make_latest: ${{ steps.tag.outputs.prerelease == 'false' }}
          generate_release_notes: true
          files: release/*
